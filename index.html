<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Una página de bienvenida sencilla, moderna y adaptable a cualquier pantalla.">
    <title>Hola, mundo | Estudio</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202622;
            --muted: #68716b;
            --paper: #f7f8f4;
            --surface: #ffffff;
            --accent: #d94f35;
            --accent-dark: #b83b26;
            --line: #e4e8e1;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
        }

        .site-header {
            width: min(100% - 64px, 1200px);
            min-height: 88px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand-mark {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 9px;
            border-radius: 50%;
            background: var(--accent);
        }

        .header-note {
            color: var(--muted);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        main {
            width: min(100% - 64px, 1200px);
            flex: 1;
            margin: 0 auto;
            display: flex;
            align-items: center;
            padding: 64px 0;
        }

        .hero {
            width: 100%;
            min-height: 520px;
            display: flex;
            align-items: stretch;
            overflow: hidden;
            background: var(--surface);
        }

        .hero-copy {
            flex: 1 1 54%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: clamp(36px, 7vw, 96px);
        }

        .eyebrow {
            margin: 0 0 24px;
            color: var(--accent-dark);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 620px;
            margin: 0;
            font-size: clamp(44px, 6.2vw, 78px);
            font-weight: 400;
            line-height: 1.04;
        }

        h1 span {
            color: var(--accent);
            font-style: italic;
        }

        .intro {
            max-width: 430px;
            margin: 24px 0 32px;
            color: var(--muted);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.7;
        }

        .cta {
            min-height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 0 22px;
            background: var(--accent);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        .cta:hover {
            transform: translateY(-2px);
            background: var(--accent-dark);
        }

        .cta:focus-visible,
        .brand:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 4px;
        }

        .cta-arrow {
            font-size: 19px;
            line-height: 1;
        }

        .hero-image {
            flex: 0 1 46%;
            min-width: 0;
            min-height: 520px;
            object-fit: cover;
            object-position: center;
        }

        .site-footer {
            width: min(100% - 64px, 1200px);
            min-height: 76px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }

        .site-footer p {
            margin: 0;
        }

        .site-footer a {
            text-decoration-color: #aab1aa;
            text-underline-offset: 3px;
        }

        @media (max-width: 700px) {
            .site-header,
            main,
            .site-footer {
                width: min(100% - 40px, 560px);
            }

            .site-header {
                min-height: 72px;
            }

            .header-note {
                font-size: 12px;
            }

            main {
                padding: 28px 0;
            }

            .hero {
                flex-direction: column;
            }

            .hero-copy {
                padding: 44px 32px 40px;
            }

            h1 {
                font-size: clamp(42px, 12vw, 62px);
            }

            .intro {
                font-size: 15px;
            }

            .hero-image {
                flex-basis: auto;
                width: 100%;
                min-height: 0;
                height: clamp(220px, 60vw, 330px);
            }

            .site-footer {
                min-height: 72px;
                align-items: flex-start;
                justify-content: center;
                flex-direction: column;
                gap: 6px;
                padding: 16px 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#inicio" aria-label="Estudio, ir al inicio">
            <span class="brand-mark" aria-hidden="true"></span>estudio.
        </a>
        <p class="header-note">Un buen lugar para empezar.</p>
    </header>

    <main id="inicio">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <p class="eyebrow">Una nueva página comienza aquí</p>
                <h1 id="hero-title">Hola, mundo.<br><span>Qué bueno verte.</span></h1>
                <p class="intro">Este es un pequeño espacio para grandes ideas. Explora, descubre y empieza algo nuevo.</p>
                <a class="cta" href="#contacto">
                    Comenzar ahora <span class="cta-arrow" aria-hidden="true">&rarr;</span>
                </a>
            </div>
            <img
                class="hero-image"
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=85"
                alt="Lago tranquilo entre montañas al amanecer"
                fetchpriority="high"
            >
        </section>
    </main>

    <footer class="site-footer" id="contacto">
        <p>&copy; 2026 Estudio. Hecho para empezar.</p>
        <a href="mailto:hola@estudio.example">Contacto</a>
    </footer>
</body>
</html>
